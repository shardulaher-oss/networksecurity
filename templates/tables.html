<!DOCTYPE html>
<html>
<head>
    <title>Network Security - Predictions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 30px; }
        h2 { color: #343a40; margin-bottom: 20px; }
        .summary-box { 
            padding: 15px; border-radius: 8px; 
            margin-bottom: 25px; font-size: 18px; 
            font-weight: bold; 
        }
        .phishing { background-color: #ffe0e0; color: #c0392b; }
        .legitimate { background-color: #e0ffe0; color: #27ae60; }
        table { font-size: 13px; }
        tr.phishing-row { background-color: #ffe0e0 !important; }
        tr.legit-row { background-color: #e0ffe0 !important; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h2>🛡️ Network Security - Phishing Detection Results</h2>

        <!-- Summary -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="summary-box phishing">
                    🚨 Phishing URLs: {{ phishing_count }}
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-box legitimate">
                    ✅ Legitimate URLs: {{ legit_count }}
                </div>
            </div>
            <div class="col-md-3">
                <div class="summary-box" style="background:#e8f4f8; color:#2980b9;">
                    📊 Total Scanned: {{ total_count }}
                </div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-responsive">
            {{ table | safe }}
        </div>
    </div>

    <script>
        // Color rows based on prediction
        document.querySelectorAll("table tr").forEach(row => {
            const cells = row.querySelectorAll("td");
            if (cells.length > 0) {
                const lastCell = cells[cells.length - 1].innerText.trim();
                if (lastCell === "1.0") {
                    row.classList.add("phishing-row");
                } else if (lastCell === "0.0" || lastCell === "-1.0") {
                    row.classList.add("legit-row");
                }
            }
        });
    </script>
</body>
</html>
